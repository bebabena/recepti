<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recepti">
<meta name="theme-color" content="#C0492E">
<title>Recepti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --paper:#FFFDF8; --ink:#2B2118; --clay:#C0492E; --clayDk:#9E3823;
    --sage:#5E6B52; --line:#E6DDCD; --muted:#8A7E6E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Karla,sans-serif;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button,input,textarea{font-family:inherit;color:inherit;outline:none}
  a{color:var(--sage)}
  .spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  header{position:sticky;top:0;z-index:10;background:rgba(251,247,240,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:baseline;gap:8px;cursor:pointer}
  .brand b{font-family:Fraunces,serif;font-size:26px;font-weight:600;font-style:italic;color:var(--clay)}
  .brand span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .hbtns{display:flex;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:13px;cursor:pointer}
  .pill.primary{background:var(--clay);color:#fff;border-color:var(--clay)}
  main{max-width:720px;margin:0 auto;padding:24px 20px 90px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card .img{height:140px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px}
  .card .body{padding:12px 14px 16px}
  .card h3{font-family:Fraunces,serif;font-size:18px;font-weight:600;line-height:1.2;margin-bottom:6px}
  .card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px}

  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);
    cursor:pointer;font-weight:700;font-size:14px;padding:4px 0;margin-bottom:12px}
  h1.page{font-family:Fraunces,serif;font-size:28px;font-weight:600;display:flex;align-items:center;gap:10px;margin:4px 0 8px}
  .hero{width:100%;max-height:280px;object-fit:cover;border-radius:16px;margin-bottom:18px}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1.recipe{font-family:Fraunces,serif;font-size:32px;font-weight:600;line-height:1.1;margin-bottom:6px}
  .iconbtn{background:none;border:none;cursor:pointer;padding:8px;display:inline-flex}
  .detmeta{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-bottom:4px}
  .sectionrow{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}
  h2.section{font-family:Fraunces,serif;font-size:20px;font-weight:600}

  .toggle{display:flex;background:var(--line);border-radius:999px;padding:3px;cursor:pointer;font-size:12px;font-weight:700}
  .toggle span{padding:5px 12px;border-radius:999px;color:var(--muted)}
  .toggle span.on{background:var(--paper);color:var(--ink)}

  ul.ings{list-style:none}
  ul.ings li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .box{width:22px;height:22px;flex-shrink:0;border-radius:6px;margin-top:1px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;line-height:1}
  .box.on{background:var(--sage);border-color:var(--sage)}
  li.done .txt{text-decoration:line-through;color:var(--muted)}
  ol.steps{list-style:none}
  ol.steps li{display:flex;gap:14px;margin-bottom:16px}
  ol.steps .n{font-family:Fraunces,serif;font-style:italic;font-size:22px;color:var(--clay);line-height:1;min-width:28px}
  ol.steps .txt{line-height:1.55}
  .notes{margin-top:26px;background:rgba(94,107,82,.09);border:1px solid rgba(94,107,82,.25);border-radius:12px;padding:16px 18px}
  .notes h3{font-family:Fraunces,serif;font-size:15px;font-weight:600;margin-bottom:6px}
  .notes ul{margin:0;padding-left:18px;line-height:1.6}
  .source{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .source a{word-break:break-all}

  label.lbl{display:block;font-weight:700;font-size:14px;margin:6px 0}
  label.lbl small{color:var(--muted);font-weight:400}
  .inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
    font-size:15px;margin-bottom:12px}
  textarea.inp{resize:vertical}
  .row{display:flex;gap:10px}
  .dropzone{border-radius:14px;margin-bottom:16px;border:2px dashed var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--muted);
    position:relative;background-size:cover;background-position:center}
  .dropzone .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;border-radius:999px;
    padding:6px;cursor:pointer;color:#fff;display:inline-flex}
  .tabs{display:flex;gap:8px;margin:16px 0}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
    font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .primaryBtn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:13px 22px;border-radius:999px;
    border:none;background:var(--clay);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .primaryBtn:disabled{opacity:.5}
  .empty{text-align:center;padding:60px 20px}
  .empty h2{font-family:Fraunces,serif;font-size:24px;margin-bottom:8px}
  .empty p{color:var(--muted);margin-bottom:24px}
  .center{display:flex;justify-content:center;padding:60px}
  .err{color:var(--clayDk);font-size:14px;margin:6px 0}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="go('list')"><b>Recepti</b><span>shared kitchen</span></div>
  <div class="hbtns" id="hbtns"></div>
</header>
<main id="app"><div class="center"><div class="spin">⏳</div></div></main>
<div id="status" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));font-size:13px;font-weight:700;text-align:center"></div>

<!-- ============ FIREBASE ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ⬇⬇⬇  PASTE YOUR FIREBASE CONFIG HERE (Step 3 in the guide)  ⬇⬇⬇ */
const firebaseConfig = {
  apiKey: "AIzaSyDK0x8ZuSmE3eP4YVZ-PTDvIRvjso3rgp4",
  authDomain: "miserecepti.firebaseapp.com",
  databaseURL: "https://miserecepti-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "miserecepti",
  storageBucket: "miserecepti.firebasestorage.app",
  messagingSenderId: "867224224551",
  appId: "1:867224224551:web:bae0b289e34ef0c0b09f02"
};
/* ⬆⬆⬆  ------------------------------------------------------  ⬆⬆⬆ */

const DATA_PATH = "recepti/recipes";   // where the recipe list lives in the DB
const db = getDatabase(initializeApp(firebaseConfig));
const dataRef = ref(db, DATA_PATH);

let recipes = [];
window.go = go;
let state = { view: "list", activeId: null };
let connected = false;

function showStatus(msg, color){
  const el=document.getElementById("status");
  el.style.display="block"; el.style.background=color; el.style.color="#fff"; el.innerHTML=msg;
}
function hideStatus(){ document.getElementById("status").style.display="none"; }

// If Firebase hasn't connected within 6s, tell the user why (instead of spinning forever)
const connectTimeout = setTimeout(()=>{
  if(!connected){
    document.getElementById("app").innerHTML =
      `<div class="empty fade"><h2>Can't reach the database</h2>
       <p>The app loaded but couldn't connect to Firebase.<br>
       This is normal inside Claude's preview (it blocks Firebase). On your GitHub Pages link it will connect fine.</p></div>`;
    showStatus("⚠ Not connected — open this on your live GitHub Pages URL", "#9E3823");
  }
}, 6000);

// live listener — fires whenever the DB changes (your phone or hers)
onValue(dataRef, (snap) => {
  connected = true; clearTimeout(connectTimeout); hideStatus();
  const val = snap.val();
  recipes = Array.isArray(val) ? val : (val ? Object.values(val) : []);
  render();
}, (err) => {
  connected = true; clearTimeout(connectTimeout);
  showStatus("⚠ Database read denied: "+err.code+" — check Rules tab is in test mode", "#9E3823");
});
function persist(list){
  recipes = list;
  set(dataRef, list).catch(e => showStatus("⚠ Save failed: "+e.code, "#9E3823"));
} // write -> syncs to both

/* ---------- unit conversion ---------- */
const CONV = {
  g:{f:v=>v*0.035274,l:"oz"}, kg:{f:v=>v*2.20462,l:"lb"},
  ml:{f:v=>v*0.033814,l:"fl oz"}, l:{f:v=>v*4.22675,l:"cup"},
  "°c":{f:v=>v*9/5+32,l:"°F"}, cm:{f:v=>v*0.393701,l:"in"}
};
const round=n=>Math.round(n*100)/100;
function convert(text, imperial){
  if(!imperial) return text;
  return text.replace(/(\d+(?:[.,]\d+)?)\s?(kg|g|ml|l|°C|cm)\b/gi,(m,num,unit)=>{
    const c=CONV[unit.toLowerCase()]; if(!c) return m;
    return round(c.f(parseFloat(num.replace(",","."))))+" "+c.l;
  });
}
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- navigation ---------- */
function go(view, id){ state={view, activeId: id ?? state.activeId}; render(); }
function activeRecipe(){ return recipes.find(r=>r.id===state.activeId); }

/* ---------- AI digest (only works inside Claude; on the live site, use Paste-> manual) ---------- */
async function digest({url, rawText}){
  const sys=`You extract recipes into clean structured data. Output ONLY valid JSON, no fences, no preamble. Schema:
{"title":string,"servings":string,"time":string,"ingredients":[string],"steps":[string],"notes":[string]}
Rules: METRIC units (g,kg,ml,l,°C). Steps concise, no fluff. notes = key tips in text but not in steps (omit if none). If no recipe: {"error":"..."}.`;
  const body={model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,
    messages:[{role:"user",content:[{type:"text",text: url?`Fetch and extract the recipe from: ${url}`:`Extract the recipe from this text:\n\n${rawText}`}]}]};
  if(url) body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json();
  const t=data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").replace(/```json|```/g,"").trim();
  const m=t.match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:t);
}
const aiAvailable = location.hostname.includes("claude") || location.hostname==="localhost";

/* ---------- render ---------- */
function render(){
  const hb=document.getElementById("hbtns");
  hb.innerHTML = state.view==="list"
    ? `<button class="pill" onclick="go('import')">🔗 Import</button>
       <button class="pill primary" onclick="go('add')">＋ Add</button>` : "";
  const app=document.getElementById("app");
  if(state.view==="list") app.innerHTML=viewList();
  else if(state.view==="detail") app.innerHTML=viewDetail();
  else if(state.view==="import") app.innerHTML=viewImport();
  else if(state.view==="add"||state.view==="edit") app.innerHTML=viewForm();
  attach();
}

function viewList(){
  if(!recipes.length) return `<div class="empty fade">
    <h2>Your shelf is empty</h2>
    <p>Paste a link or write one in by hand. It syncs to both phones instantly.</p>
    <button class="pill primary" onclick="go('add')">＋ Add your own</button></div>`;
  return `<div class="grid fade">`+recipes.map(r=>`
    <div class="card" onclick="go('detail','${r.id}')">
      <div class="img" style="background:${r.image?`url(${r.image})`:`linear-gradient(135deg,#5E6B5222,#C0492E22)`};background-size:cover;background-position:center"></div>
      <div class="body"><h3>${esc(r.title)}</h3>
        <div class="meta">${r.time?`<span>${esc(r.time)}</span>`:""}${r.servings?`<span>${esc(r.servings)}</span>`:""}</div>
      </div></div>`).join("")+`</div>`;
}

function viewDetail(){
  const r=activeRecipe(); if(!r) return go("list");
  const imp = state.imperial||false;
  return `<div class="fade">
    <button class="back" onclick="go('list')">← Back</button>
    ${r.image?`<img class="hero" src="${r.image}">`:""}
    <div class="titlerow">
      <h1 class="recipe">${esc(r.title)}</h1>
      <div>
        <button class="iconbtn" style="color:var(--sage)" onclick="go('edit','${r.id}')">✎</button>
        <button class="iconbtn" style="color:var(--clayDk)" onclick="delRecipe('${r.id}')">🗑</button>
      </div>
    </div>
    <div class="detmeta">${r.time?`<span>⏱ ${esc(r.time)}</span>`:""}${r.servings?`<span>🍽 ${esc(r.servings)}</span>`:""}</div>
    <div class="sectionrow"><h2 class="section">Ingredients</h2>
      <div class="toggle" onclick="toggleUnit()">
        <span class="${imp?"":"on"}">Metric</span><span class="${imp?"on":""}">Imperial</span></div>
    </div>
    <ul class="ings">${(r.ingredients||[]).map((ing,i)=>{
      const done=(state.checked||{})[i];
      return `<li class="${done?"done":""}" onclick="toggleCheck(${i})">
        <span class="box ${done?"on":""}">${done?"✓":""}</span>
        <span class="txt">${esc(convert(ing,imp))}</span></li>`;}).join("")}</ul>
    <h2 class="section" style="margin-top:30px">Method</h2>
    <ol class="steps">${(r.steps||[]).map((s,i)=>`<li><span class="n">${i+1}</span><span class="txt">${esc(convert(s,imp))}</span></li>`).join("")}</ol>
    ${(r.notes&&r.notes.length)?`<div class="notes"><h3>Good to know</h3><ul>${r.notes.map(n=>`<li>${esc(convert(n,imp))}</li>`).join("")}</ul></div>`:""}
    ${r.source?`<div class="source">Source: <a href="${esc(r.source)}" target="_blank" rel="noreferrer">${esc(r.source)}</a></div>`:""}
  </div>`;
}

function viewImport(){
  const mode=state.importMode||"paste";
  return `<div class="fade">
    <button class="back" onclick="go('list')">← Back</button>
    <h1 class="page">✨ Import a recipe</h1>
    <p style="color:var(--muted);margin-top:-4px">Strips the life stories — keeps ingredients, steps and key tips, in metric.</p>
    ${aiAvailable?`<div class="tabs">
        <button class="tab ${mode==='url'?'on':''}" onclick="setImportMode('url')">From a link</button>
        <button class="tab ${mode==='paste'?'on':''}" onclick="setImportMode('paste')">Paste text</button></div>`
      :`<p class="hint" style="margin:14px 0">AI auto-import runs inside Claude. On the live site, paste the recipe text and it'll open the form pre-filled for you to tidy & save.</p>`}
    ${(aiAvailable&&mode==='url')
      ? `<input class="inp" id="impUrl" placeholder="https://…">`
      : `<textarea class="inp" id="impText" rows="9" placeholder="Paste the full recipe text here…"></textarea>`}
    <div class="err" id="impErr"></div>
    <button class="primaryBtn" id="impBtn">${aiAvailable?"Digest recipe":"Continue to form"}</button>
  </div>`;
}

function viewForm(){
  const editing = state.view==="edit";
  const r = editing ? activeRecipe() : (state.draft||{});
  state.draft = state.draft||{};
  const v=(k,d="")=> esc(r[k]!=null?r[k]:d);
  const arr=k=> (r[k]||[]).join("\n");
  return `<div class="fade">
    <button class="back" onclick="go('${editing?'detail':'list'}')">← Back</button>
    <h1 class="page">${editing?"Edit recipe":"Add your own"}</h1>
    <div class="dropzone" id="drop" style="${r.image?`height:200px;background-image:url(${r.image})`:'height:110px'}">
      ${r.image?`<button class="x" id="rmImg">✕</button>`:`<span>📷 Add a photo of the meal</span>`}
    </div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <input class="inp" id="f_title" placeholder="Recipe name" style="font-family:Fraunces,serif;font-size:18px" value="${v('title')}">
    <div class="row">
      <input class="inp" id="f_servings" placeholder="Servings (e.g. 4)" value="${v('servings')}">
      <input class="inp" id="f_time" placeholder="Time (e.g. 45 min)" value="${v('time')}">
    </div>
    <label class="lbl">Ingredients <small>— one per line, metric units</small></label>
    <textarea class="inp" id="f_ing" rows="6" placeholder="200 g flour&#10;2 eggs&#10;300 ml milk">${esc(arr('ingredients'))}</textarea>
    <label class="lbl">Steps <small>— one per line</small></label>
    <textarea class="inp" id="f_steps" rows="6" placeholder="Mix dry ingredients.&#10;Whisk in eggs and milk.">${esc(arr('steps'))}</textarea>
    <label class="lbl">Notes / tips <small>— optional, one per line</small></label>
    <textarea class="inp" id="f_notes" rows="3" placeholder="Rest batter 30 min for fluffier result.">${esc(arr('notes'))}</textarea>
    <label class="lbl">Source link <small>— optional</small></label>
    <input class="inp" id="f_source" placeholder="https://… or a cookbook name" value="${v('source')}">
    <button class="primaryBtn" id="saveBtn">${editing?"Save changes":"Save to shared shelf"}</button>
  </div>`;
}

/* ---------- interactions ---------- */
window.toggleUnit=()=>{ state.imperial=!state.imperial; render(); };
window.toggleCheck=(i)=>{ state.checked=state.checked||{}; state.checked[i]=!state.checked[i]; render(); };
window.setImportMode=(m)=>{ state.importMode=m; render(); };
window.delRecipe=(id)=>{ if(confirm("Delete this recipe?")){ persist(recipes.filter(r=>r.id!==id)); go("list"); } };

function attach(){
  // reset transient detail state when leaving detail
  if(state.view!=="detail"){ state.checked={}; }
  if(state.view==="import"){
    const btn=document.getElementById("impBtn");
    btn.onclick=async()=>{
      const errEl=document.getElementById("impErr"); errEl.textContent="";
      if(aiAvailable){
        const mode=state.importMode||"paste";
        const url=document.getElementById("impUrl")?.value;
        const text=document.getElementById("impText")?.value;
        if(mode==="url"&&!url) return; if(mode==="paste"&&!text) return;
        btn.textContent="Digesting…"; btn.disabled=true;
        try{ const out=await digest(mode==="url"?{url}:{rawText:text});
          if(out.error){ errEl.textContent=out.error; btn.textContent="Digest recipe"; btn.disabled=false; return; }
          state.draft={...out, source: mode==="url"?url:""}; go("add");
        }catch(e){ errEl.textContent="Couldn't read that. Try pasting the text instead."; btn.textContent="Digest recipe"; btn.disabled=false; }
      } else {
        // live site: dump pasted text into the steps box for manual tidy
        const text=document.getElementById("impText")?.value||"";
        state.draft={ steps: text.split("\n").map(s=>s.trim()).filter(Boolean) };
        go("add");
      }
    };
  }
  if(state.view==="add"||state.view==="edit"){
    const drop=document.getElementById("drop"), file=document.getElementById("file");
    const editing=state.view==="edit"; const target=editing?activeRecipe():state.draft;
    drop.onclick=()=>file.click();
    file.onchange=e=>{ const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ target.image=rd.result; render(); }; rd.readAsDataURL(f); };
    const rm=document.getElementById("rmImg"); if(rm) rm.onclick=(e)=>{ e.stopPropagation(); target.image=""; render(); };
    document.getElementById("saveBtn").onclick=()=>{
      const g=id=>document.getElementById(id).value;
      const lines=id=>g(id).split("\n").map(s=>s.trim()).filter(Boolean);
      const title=g("f_title").trim(); if(!title) return;
      const rec={
        id: editing?activeRecipe().id : Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        title, servings:g("f_servings").trim(), time:g("f_time").trim(),
        image: target.image||"", source:g("f_source").trim(),
        ingredients:lines("f_ing"), steps:lines("f_steps"), notes:lines("f_notes")
      };
      const next = editing ? recipes.map(x=>x.id===rec.id?rec:x) : [rec,...recipes];
      persist(next); state.draft={}; go("detail", rec.id);
    };
  }
}
</script>
</body>
</html>
